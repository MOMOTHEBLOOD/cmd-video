[package]
name = "cmd-video"
version = "0.1.0"
edition = "2021"
description = "在 CMD 终端里播放视频（半块真彩 ANSI + ffmpeg 管道，静音）"
license = "MIT"

[dependencies]
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
